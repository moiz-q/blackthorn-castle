<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blackthorn Castle</title>
  <meta name="description" content="Read Blackthorn Castle, a web comic.">
  <meta name="theme-color" content="#0b0a0e">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blackthorn Castle">
  <meta property="og:description" content="A web comic.">
  <meta property="og:image" content="https://moiz-q.github.io/blackthorn-castle/assets/share.jpg">
  <meta property="og:url" content="https://moiz-q.github.io/blackthorn-castle/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="reader">
    <header class="bar top">
      <a class="icon-btn" href="./" aria-label="Back to the cover">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </a>
      <div class="title">Blackthorn Castle<small id="chapterLabel">Chapter 1</small></div>
      <span class="hint">← → to turn · click to zoom</span>
    </header>

    <main class="stage" id="stage">
      <img id="page" alt="" width="1536" height="1024">
      <button class="side prev" id="sidePrev" aria-label="Previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="side next" id="sideNext" aria-label="Next page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <section class="end" id="end" hidden>
        <p id="endKicker">Blackthorn Castle</p>
        <h2 id="endTitle">End of Chapter 1</h2>
        <p id="endBy" hidden></p>
        <div class="actions">
          <a class="btn primary" id="endPrimary" href="#1">Read from the start</a>
          <a class="btn" href="./">Back to the cover</a>
        </div>
      </section>
    </main>

    <nav class="bar bottom" aria-label="Pages">
      <div class="progress" id="progress"></div>
      <button class="icon-btn" id="prev" aria-label="Previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span class="label">Previous</span>
      </button>
      <select class="jump" id="jump" aria-label="Go to page"></select>
      <button class="icon-btn" id="next" aria-label="Next page">
        <span class="label">Next</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </nav>
  </div>

  <div class="zoom" id="zoom" hidden>
    <button class="icon-btn close" id="zoomClose" aria-label="Close zoom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <img id="zoomImg" alt="">
  </div>

  <script src="assets/comic.js"></script>
  <script src="assets/reader.js"></script>
</body>
</html>
